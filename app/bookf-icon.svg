<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Nord 0 to Nord 1) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3440"/>
      <stop offset="100%" stop-color="#3B4252"/>
    </linearGradient>

    <!-- Book Cover Base Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E81AC"/>
      <stop offset="100%" stop-color="#4C566A"/>
    </linearGradient>

    <!-- Left Page Gradient -->
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E9F0"/>
      <stop offset="85%" stop-color="#ECEFF4"/>
      <stop offset="100%" stop-color="#D8DEE9"/>
    </linearGradient>

    <!-- Right Page Gradient -->
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8DEE9"/>
      <stop offset="15%" stop-color="#ECEFF4"/>
      <stop offset="100%" stop-color="#E5E9F0"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#81A1C1"/>
    </linearGradient>

    <!-- Star Glow / Gradient -->
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCB8B"/>
      <stop offset="100%" stop-color="#D08770"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Canvas with 1px Nord Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)" stroke="#4C566A" stroke-width="6"/>

  <!-- Book Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Book Outer Cover Thick Edge (Base) -->
    <path d="M 104 350
             C 160 365, 230 368, 256 392
             C 282 368, 352 365, 408 350
             L 408 368
             C 352 383, 282 386, 256 410
             C 230 386, 160 383, 104 368
             Z"
          fill="url(#coverGrad)"/>

    <!-- Left Under Pages (Stack Effect) -->
    <path d="M 108 344
             C 162 358, 228 360, 256 384
             L 256 376
             C 228 352, 162 350, 108 336
             Z"
          fill="#D8DEE9"/>

    <!-- Right Under Pages (Stack Effect) -->
    <path d="M 404 344
             C 350 358, 284 360, 256 384
             L 256 376
             C 284 352, 350 350, 404 336
             Z"
          fill="#D8DEE9"/>

    <!-- Left Main Page -->
    <path d="M 112 166
             C 166 182, 226 184, 256 208
             L 256 376
             C 226 352, 166 350, 112 334
             Z"
          fill="url(#leftPage)"/>

    <!-- Right Main Page -->
    <path d="M 400 166
             C 346 182, 286 184, 256 208
             L 256 376
             C 286 352, 346 350, 400 334
             Z"
          fill="url(#rightPage)"/>

    <!-- Center Spine / Fold Line -->
    <line x1="256" y1="208" x2="256" y2="376" stroke="#4C566A" stroke-width="2.5" opacity="0.4"/>

    <!-- Left Page Text Lines -->
    <line x1="140" y1="225" x2="226" y2="242" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="255" x2="226" y2="272" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="285" x2="204" y2="298" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Page Text Lines -->
    <line x1="286" y1="242" x2="372" y2="225" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="286" y1="272" x2="372" y2="255" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="286" y1="302" x2="348" y2="289" stroke="#81A1C1" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Hanging Bookmark Ribbon -->
    <path d="M 244 192
             L 244 316
             L 256 304
             L 268 316
             L 268 192
             Z"
          fill="url(#ribbon)"
          filter="url(#subtleShadow)"/>
  </g>

  <!-- Golden Rating Star at Top Right -->
  <g transform="translate(372, 108) scale(1.15)" filter="url(#subtleShadow)">
    <!-- Star Path -->
    <path d="M 0 -28
             L 8 -9
             L 28 -7
             L 13 8
             L 17 28
             L 0 17
             L -17 28
             L -13 8
             L -28 -7
             L -8 -9
             Z"
          fill="url(#star)"/>
  </g>
</svg>
